# Builds the jaspy-nexus container image and pushes it to GitHub Container
# Registry (free for public repos/images). Deployment is manual — apply the
# manifest kept outside this repo with kubectl.
name: build-nexus-image

on:
  push:
    branches: [master, nexus-merge]
    paths:
      - "nexus/**"
      - ".github/workflows/build-nexus-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jaspy-nexus
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'nexus-merge' }}

      - uses: docker/build-push-action@v6
        with:
          context: nexus
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
