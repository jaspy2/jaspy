[package]
name = "jaspy-nexus"
version = "2.2.0"
authors = ["Antti Tönkyrä <daedalus@pingtimeout.net>"]
edition = "2018"


[dependencies]
# yaml only: the merged config files are /etc/jaspy/poller.yml etc.
config = { version = "0.15", default-features = false, features = ["yaml"] }
rocket = { version = "0.5.1", features = ["json"] }
# WebSocket support for Rocket (live log streaming to the web UI).
rocket_ws = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diesel = { version = "2.2", features = ["postgres", "sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
# Bundled SQLite (>=3.35: RETURNING + upsert) so no system libsqlite3 is needed.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
# MQTT: rumqttc (tokio 1.x) replaces the abandoned rumq-client alpha.
# default-features off: we connect plaintext on 1883, so no TLS backend is needed.
rumqttc = { version = "0.24", default-features = false }
# In-process poller/pinger collectors (formerly standalone binaries).
# reqwest without default TLS: all snmpbot/jaspy traffic is plaintext http.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rand = "0.7.3"
oping = "0.4.0"
# Embeds the built React admin UI (webui/dist) into the binary; in debug
# builds it reads from disk so frontend iteration needs no Rust rebuild.
rust-embed = "8"
# fork() for the trap-handler subcommand (parent returns to snmptrapd
# immediately while the child reports over HTTP).
libc = "0.2"
# `mock` subcommand: ephemeral postgres (initdb into a tempdir) with embedded
# migrations. Inert unless the binary is started as `jaspy-nexus mock`.
diesel_migrations = "2.2"
tempfile = "3"
snmp2 = { version = "0.5.2", default-features = false }

[dev-dependencies]
# End-to-end test suite (tests/e2e.rs): mock snmpbot, ephemeral postgres,
# embedded MQTT broker.
httpmock = "0.7"
rumqttd = "0.19"
regex = "1"
# WebSocket client for asserting the live-log stream end to end.
tungstenite = "0.21"
